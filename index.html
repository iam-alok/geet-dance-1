    // ----------------------------------------------------
    // BACKGROUND CANVAS DUST PARTICLES
    // ----------------------------------------------------
    function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particlesArray = [];
      
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = Math.random() * 0.4 - 0.2;
          this.speedY = -(Math.random() * 0.5 + 0.1);
          this.color = Math.random() > 0.5 ? 'rgba(0, 240, 255, 0.4)' : 'rgba(255, 0, 127, 0.3)';
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.y < 0) {
            this.y = canvas.height;
            this.x = Math.random() * canvas.width;
          }
          if (this.x < 0 || this.x > canvas.width) {
            this.speedX = -this.speedX;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.shadowBlur = 0; // reset
        }
      }

      function init() {
        particlesArray = [];
        const numberOfParticles = Math.min(Math.floor(canvas.width / 20), 80);
        for (let i = 0; i < numberOfParticles; i++) {
          particlesArray.push(new Particle());
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        requestAnimationFrame(animate);
      }

      init();
      animate();
    }

    // ----------------------------------------------------
    // CURSOR TRACKING LIGHT
    // ----------------------------------------------------
    function initCursorGlow() {
      const glow = document.getElementById('cursor-glow');
      if (!glow) return;
      
      let mouseX = 0, mouseY = 0;
      let currentX = 0, currentY = 0;
      
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function ease() {
        // Easing interpolation for butter-smooth cursor follow tracking
        const easeAmount = 0.08;
        currentX += (mouseX - currentX) * easeAmount;
        currentY += (mouseY - currentY) * easeAmount;
        
        glow.style.left = `${currentX}px`;
        glow.style.top = `${currentY}px`;
        
        requestAnimationFrame(ease);
      }
      ease();
    }

            </p>
          </div>

          {/* Filtering Tabs Bar */}
          <div className="flex justify-center space-x-4">
            {[
              { id: 'all', label: 'All Items' },
              { id: 'perf', label: 'Performances' },
              { id: 'class', label: 'Classrooms' },
              { id: 'studio', label: 'Studio Life' }
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setFilter(tab.id)}
                className={`px-5 py-2 rounded-full font-poppins text-xs font-bold tracking-widest uppercase border transition-all duration-300 ${
                  filter === tab.id 
                    ? 'bg-neonCyan text-black border-neonCyan' 
                    : 'bg-transparent text-gray-400 border-white/10 hover:text-white hover:border-white/20'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Staggered Masonry Layout (Pure CSS Responsive Columns) */}
          <div className="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
            {filteredItems.map((item) => (
              <div 
                key={item.id}
                onClick={() => setLightboxAsset(item)}
                className="break-inside-avoid glass-card p-2 relative overflow-hidden group cursor-pointer border border-white/5 hover:neon-border-cyan mb-6"
              >
                <div className="relative overflow-hidden rounded-xl border border-white/5">
                  <img 
                    src={item.img} 
                    alt={item.title} 
                    className="w-full object-cover group-hover:scale-105 group-hover:blur-[2px] transition-all duration-500"
                  />
                  {/* Hover Info Overlay */}
                  <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6 space-y-1">
                    <span className="text-[9px] font-bold text-neonCyan uppercase tracking-widest font-poppins">
                      {item.type === 'perf' ? 'Stage Performance' : item.type === 'class' ? 'Classroom Session' : 'Studio Highlight'}

                    <h4 className="text-lg font-bold text-white font-poppins">{item.title}</h4>
                    <p className="text-xs text-gray-400 font-poppins">{item.desc}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* LIGHTBOX MODAL */}
          <AnimatePresence>
            {lightboxAsset && (
              <MDiv 
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95 backdrop-blur-md"
                onClick={() => setLightboxAsset(null)}
              >
                <MDiv
                  initial={{ scale: 0.95 }}
                  animate={{ scale: 1 }}
                  exit={{ scale: 0.95 }}
                  className="max-w-4xl w-full relative"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button 
                    onClick={() => setLightboxAsset(null)}
                    className="absolute -top-12 right-0 text-white font-poppins font-bold text-3xl hover:text-neonCyan transition-colors"
                  >
                    &times;
                  </button>
                  <img 
                    src={lightboxAsset.img} 
                    alt={lightboxAsset.title} 
                    className="w-full h-auto max-h-[80vh] object-contain rounded-2xl border border-white/10"
                  />
                  <div className="mt-4 text-center space-y-1">
                    <h3 className="text-xl font-bold font-poppins text-white">{lightboxAsset.title}</h3>
                    <p className="text-sm font-poppins text-gray-400">{lightboxAsset.desc}</p>
                  </div>
                </MDiv>
              </MDiv>
            )}
          </AnimatePresence>

        </section>
      );
    }
